services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: user, POSTGRES_PASSWORD: pass, POSTGRES_DB: aiemployee}
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  server:
    build: ./server
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./server:/app"]
    depends_on: [postgres, redis]
  worker:
    build: ./server
    command: celery -A app.workers.celery_app.celery worker -l info
    env_file: .env
    depends_on: [redis, postgres]
  beat:
    build: ./server
    command: celery -A app.workers.celery_app.celery beat -l info
    env_file: .env
    depends_on: [redis]
  client:
    build: ./client
    ports: ["3000:3000"]
    env_file: ./client/.env.example
    volumes: ["./client:/app"]
    depends_on: [server]
